spring:
  application:
    name: meeting-summarizer

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:minutebook}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Application configuration
app:
  audio:
    storage-dir: ./data/audio
  groq:
    api-key: ${GROQ_API_KEY:}
    api-url: https://api.groq.com/openai/v1/audio/transcriptions
    model: whisper-large-v3-turbo
    llm-model: ${GROQ_LLM_MODEL:openai/gpt-oss-120b}
  openai:
    api-key: ${OPENAI_API_KEY:}
    api-url: https://api.openai.com/v1
    model: ${OPENAI_MODEL:gpt-4o-mini}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    api-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

server:
  port: 8080

logging:
  level:
    com.minutebook: INFO
    org.springframework.web: INFO

